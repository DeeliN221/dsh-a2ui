name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check client bundle budget
        run: |
          size=$(wc -c < lib/client.js)
          echo "client bundle: $size bytes"
          if [ "$size" -gt 6500000 ]; then
            echo "::error::lib/client.js exceeds the 6.5 MB budget ($size bytes)"
            exit 1
          fi
      - run: pnpm test
